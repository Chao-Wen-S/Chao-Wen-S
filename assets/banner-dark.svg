<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" fill="none" role="img" aria-label="努力研学的神 — 学生 / 研究者">
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="72"/></filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="16"/></filter>
    <linearGradient id="scrim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06080D"/>
      <stop offset="0.38" stop-color="#06080D"/>
      <stop offset="0.72" stop-color="#06080D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0.25">
      <stop offset="0" stop-color="#A5F3FC">
        <animate attributeName="stop-color" values="#A5F3FC;#C4B5FD;#F9A8D4;#FDE68A;#A5F3FC" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#C4B5FD">
        <animate attributeName="stop-color" values="#C4B5FD;#F9A8D4;#FDE68A;#A5F3FC;#C4B5FD" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#F9A8D4">
        <animate attributeName="stop-color" values="#F9A8D4;#FDE68A;#A5F3FC;#C4B5FD;#F9A8D4" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE"><animate attributeName="stop-color" values="#22D3EE;#A78BFA;#F472B6;#22D3EE" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#A78BFA"><animate attributeName="stop-color" values="#A78BFA;#F472B6;#22D3EE;#A78BFA" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="340" fill="#06080D"/>

  <g filter="url(#soft)">
    <ellipse cx="1075" cy="35" rx="330" ry="215" fill="#6D28D9" opacity="0.85">
      <animate attributeName="fill" values="#6D28D9;#DB2777;#0EA5E9;#6D28D9" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="35;80;35" dur="13s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="1180" cy="330" rx="300" ry="210" fill="#0EA5E9" opacity="0.8">
      <animate attributeName="fill" values="#0EA5E9;#7C3AED;#F59E0B;#0EA5E9" dur="23s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="1180;1110;1180" dur="17s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="860" cy="360" rx="280" ry="180" fill="#EC4899" opacity="0.6">
      <animate attributeName="fill" values="#EC4899;#22D3EE;#A855F7;#EC4899" dur="21s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.35;0.6" dur="11s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect width="1280" height="340" fill="url(#scrim)"/>

  <text x="1220" y="228" text-anchor="end" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="180" fill="#FFFFFF" opacity="0.045">神</text>

  <rect x="22" y="96" width="3" height="148" fill="url(#barGrad)"/>
  <text x="46" y="120" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" letter-spacing="0.3" fill="#7C8AA5">~/profile</text>

  <text x="46" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,system-ui,sans-serif" font-size="56" font-weight="600" letter-spacing="1.5" fill="url(#nameGrad)" filter="url(#glow)" opacity="0.32">努力研学的神</text>
  <text x="46" y="198" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,system-ui,sans-serif" font-size="56" font-weight="600" letter-spacing="1.5" fill="url(#nameGrad)">努力研学的神</text>

  <rect x="46" y="224" width="64" height="2" fill="url(#barGrad)"/>
  <text x="46" y="266" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',Inter,system-ui,sans-serif" font-size="19" fill="#9AA6B8">把难的东西，一点点学明白。</text>
  <text x="46" y="316" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11" letter-spacing="2.2" fill="#5A6B85">STUDENT · RESEARCHER · LEARNING IN PUBLIC</text>

  <g transform="skewX(-16)">
    <rect x="-620" y="-120" width="460" height="620" fill="url(#sheen)">
      <animate attributeName="x" values="-620;1620" dur="8.5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
